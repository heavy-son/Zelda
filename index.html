<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zelda</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <header>
       <img class="logo" src="./Imagens/Logo.png" alt="">

       <div class="icon-container">

        <div class="icone">
            <img src="./Imagens/Linha inicial.svg" alt="">
            <span>Linha Inicial</span>
        </div>

        <div class="icone">
            <img src="./Imagens/Herói criança.svg" alt="">
            <Span>Herói Criança</Span>
        </div>

        <div class="icone">
            <img src="./Imagens/Herói adulto 2.svg" alt="">
            <span>Herói Adulto</span>
        </div>

        <div class="icone">
            <img src="./Imagens/Decline.svg" alt="">
            <span>Herói Derrotado</span>
        </div>

        <div class="icone">
            <img src="./Imagens/Linha unificada.svg" alt="">
            <span>Linha Unificada</span>
        </div>

        <div class="icone">
            <img src="./Imagens/Spin offs.svg" alt="">
            <span>Spin-offs</span>
        </div>
       </div>

        <div  class="icon">
            <img src="./Imagens/Icone.png" alt="">
        </div>

    </header>

    <Main>

    <span class="linha">Linha Inicial</span>
    
     <div class="inicial">

        <div class="game">
            <img src="./Imagens/Skyward Sword.jpg" alt="">
            <span class="data">2011</span>
            <span class="zelda">Zelda</span>
            <span class="jogo">Skyward Sword</span>
        </div>

        <div class="game">
            <img src="./Imagens/Minish cap.jpeg" alt="">
            <span class="data">2004</span>
            <span class="zelda">Zelda</span>
            <span class="jogo">Minish Cap</span>
        </div>  

        <div class="game">
            <img src="./Imagens/Four swords aniversary.jpg" alt="">
            <span class="data">2003</span>
            <span class="zelda">Zelda</span>
            <span class="jogo">Four Swords</span>
        </div>        
        
        <div class="game">
            <img src="./Imagens/Skyward Sword.jpg" alt="">
            <span class="data">1998</span>
            <span class="zelda">Zelda</span>
            <span class="jogo">Ocarina of Time</span>
        </div>
       
     </div>
    </Main>

    <div class="overlay"></div>
</body>
</html>
